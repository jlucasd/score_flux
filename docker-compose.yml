services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scoreflux
      POSTGRES_USER: scoreflux
      POSTGRES_PASSWORD: scoreflux
    ports:
      - "5433:5432" # host 5433 (5432 já usado pelo gestao_vagas)
    volumes:
      - scoreflux_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoreflux"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: scoreflux
      DB_USER: scoreflux
      DB_PASSWORD: scoreflux
      SCOREFLUX_JWT_SECRET: dev-local-secret
      SCOREFLUX_CORS_ORIGINS: "*"
      PORT: 8080
    ports:
      - "8090:8080" # host 8090 (8080/8081 já ocupadas por outros projetos)
    depends_on:
      db:
        condition: service_healthy

volumes:
  scoreflux_pg_data:

services:
  - type: web
    name: scoreflux-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Banco externo (Neon). Setar manualmente no painel do Render.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SCOREFLUX_JWT_SECRET
        generateValue: true
      - key: SCOREFLUX_CORS_ORIGINS
        value: "*"
